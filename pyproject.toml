[project]
name = "vsss-vision-research"
version = "0.1.0"
description = "Avaliação quantitativa de visão computacional para Very Small Size Soccer: segmentação por cor vs. redes neurais, em escala real e com latência instrumentada"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["vsss", "robocup", "computer-vision", "robot-soccer", "benchmark"]
dependencies = [
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pyzmq>=27.1.0",
]

[project.optional-dependencies]
# Só instalada quando o detector por rede neural for de fato usado —
# manter o pipeline clássico leve é o que permite rodá-lo em hardware fixo
# de competição sem arrastar dependências de treino junto.
yolo = ["ultralytics>=8.3.0"]
dev = ["pytest>=9.0.3"]

[project.scripts]
vsss-vision = "vsss_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsss_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
